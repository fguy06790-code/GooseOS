name: Compile THYFOS amd64 ISO
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build-superlight-iso:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential git cmake ninja-build flex bison curl python3 xz-utils
      - name: Build customized amd64 ISO
        env:
          WORK_ROOT: ${{ runner.temp }}/libernt-work
          OUTPUT_DIR: ${{ github.workspace }}/outputs
        run: sh build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: THYFOS-amd64-ISO
          path: outputs/*
          if-no-files-found: error
          retention-days: 7
